<!doctype html>
<html lang="en-IE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Print town profile | Glúnta Research</title>
</head>

<body>
  <p>
    Opening the printable town report…
    <a id="reportLink" href="town-profile.html">Open report</a>
  </p>

  <script>
    const params = new URLSearchParams(location.search);

    if (params.get('auto') !== '0') {
      params.set('print', '1');
    } else {
      params.delete('print');
    }

    params.delete('auto');

    const target = 'town-profile.html?' + params.toString();

    document.getElementById('reportLink').href = target;
    location.replace(target);
  </script>
</body>
</html>
